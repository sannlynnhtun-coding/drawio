[package]
name = "drawio-desktop"
version = "1.0.0"
edition = "2024"
publish = false
default-run = "Drawio"

[dependencies]
gpui-kit = "=0.9.0"
wry = { version = "=0.57.1", default-features = false }
rfd = "0.17"
serde_json = "1"
tempfile = "3"
base64 = "0.22"
flate2 = "1"
percent-encoding = "2"
mime_guess = "2"
roxmltree = "0.21"


rust-embed = { version = "=8.13.0", features = ["debug-embed"] }

windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }



[build-dependencies]
embed-resource = "=3.0.12"

[[bin]]
name = "Drawio"
path = "src/main.rs"
