name: Desktop macOS and Linux

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'rust-desktop/**'
      - 'src/main/webapp/**'
      - '.github/workflows/desktop-unix.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS
            arch: arm64
          - runner: macos-15-intel
            platform: macOS
            arch: x64
          - runner: ubuntu-24.04
            platform: Linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libasound2-dev libssl-dev libzstd-dev \
            desktop-file-utils dpkg-dev
      - name: Build and test
        run: |
          cargo build --release --locked --manifest-path rust-desktop/Cargo.toml
          cargo test --release --locked --manifest-path rust-desktop/Cargo.toml
      - name: Package and validate
        run: python3 rust-desktop/package_unix.py --binary rust-desktop/target/release/Drawio --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Drawio-${{ matrix.platform }}-${{ matrix.arch }}
          path: rust-desktop/target/dist/*
          if-no-files-found: error
